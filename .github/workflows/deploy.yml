name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deployment'
        required: true
        default: ''

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  terraform-apply:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply tfplan

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          cd terraform
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecr_frontend=$(terraform output -json ecr_repository_urls | jq -r '.frontend')" >> $GITHUB_OUTPUT
          echo "ecr_api_gateway=$(terraform output -json ecr_repository_urls | jq -r '.["api-gateway"]')" >> $GITHUB_OUTPUT
          echo "ecr_ml_service=$(terraform output -json ecr_repository_urls | jq -r '.["ml-service"]')" >> $GITHUB_OUTPUT
          echo "ecr_ai_scaler=$(terraform output -json ecr_repository_urls | jq -r '.["ai-scaler"]')" >> $GITHUB_OUTPUT

    outputs:
      eks_cluster_name: ${{ steps.tf-outputs.outputs.eks_cluster_name }}
      ecr_frontend: ${{ steps.tf-outputs.outputs.ecr_frontend }}
      ecr_api_gateway: ${{ steps.tf-outputs.outputs.ecr_api_gateway }}
      ecr_ml_service: ${{ steps.tf-outputs.outputs.ecr_ml_service }}
      ecr_ai_scaler: ${{ steps.tf-outputs.outputs.ecr_ai_scaler }}

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: terraform-apply
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ needs.terraform-apply.outputs.ecr_frontend }}:latest
            ${{ needs.terraform-apply.outputs.ecr_frontend }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ needs.terraform-apply.outputs.ecr_api_gateway }}:latest
            ${{ needs.terraform-apply.outputs.ecr_api_gateway }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ML Service
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: true
          tags: |
            ${{ needs.terraform-apply.outputs.ecr_ml_service }}:latest
            ${{ needs.terraform-apply.outputs.ecr_ml_service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Scaler
        uses: docker/build-push-action@v5
        with:
          context: ./ai-scaler
          push: true
          tags: |
            ${{ needs.terraform-apply.outputs.ecr_ai_scaler }}:latest
            ${{ needs.terraform-apply.outputs.ecr_ai_scaler }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [terraform-apply, build-and-push]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ needs.terraform-apply.outputs.eks_cluster_name }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/frontend-deployment --timeout=5m
          kubectl rollout status deployment/api-gateway-deployment --timeout=5m
          kubectl rollout status deployment/ml-service-deployment --timeout=5m

      - name: Get service URLs
        run: |
          echo "=== Deployment Complete ==="
          kubectl get services
          echo ""
          echo "Frontend LoadBalancer:"
          kubectl get service frontend-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""

      - name: Deployment Summary
        run: |
          echo "✅ Deployment successful!"
          echo "📊 Check pods: kubectl get pods"
          echo "🌐 Access via LoadBalancer URL above"
          echo "💰 Remember to run destroy workflow when done to save costs!"
